<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ICO Launchpad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
  :root{
    --bg:#080b14; --panel:#111726; --panel-2:#0d1220; --line:#1e2740;
    --ink:#e8ecf6; --muted:#8592b0; --faint:#5a678c;
    --gold:#f0b90b; --gold-dim:#a9820c; --ok:#3ddc84; --bad:#ff6b6b; --pending:#6ba7ff; --live:#3ddc84;
    --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, rgba(240,185,11,.08), transparent 60%), var(--bg);
    color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100dvh}
  a{color:var(--gold); text-decoration:none}
  .wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px}
  .brand{display:flex; align-items:center; gap:12px}
  .logo{width:36px; height:36px; border-radius:9px; background:linear-gradient(150deg,var(--gold),#7a5c04); display:grid; place-items:center; font-weight:800; color:#1a1200; font-size:18px}
  .brand h1{font-size:16px; margin:0; letter-spacing:.2px}
  .brand p{margin:0; font-size:12px; color:var(--muted)}
  .net-wrap{display:flex; align-items:center; gap:10px; flex:none}
  .net{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right}
  .net b{color:var(--ink)}

  .btn{font-family:var(--sans); font-weight:600; font-size:14px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:11px 16px; border-radius:10px; cursor:pointer; transition:border-color .15s, background .15s, transform .05s}
  .btn:hover{border-color:#33406a}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.gold{background:linear-gradient(150deg,var(--gold),var(--gold-dim)); color:#1a1200; border-color:transparent}
  .btn.gold:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{padding:7px 12px; font-size:12.5px}

  h2.section{font-size:13px; color:var(--muted); font-weight:600; margin:0 0 12px}
  .dirhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .subhead{font-size:12.5px; color:var(--muted); font-weight:600; margin:18px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}

  /* directory list */
  .sale{display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; transition:border-color .15s, transform .05s}
  .sale:hover{border-color:#33406a}
  .sale:active{transform:translateY(1px)}
  .sale-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .sale-name{font-size:16px; font-weight:650; color:var(--ink)}
  .sale-name .sym{color:var(--muted); font-weight:500; font-size:13px; margin-left:6px}
  .badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); flex:none}
  .badge.live{color:var(--live); border-color:rgba(61,220,132,.35); background:rgba(61,220,132,.08)}
  .badge.ended{color:var(--gold); border-color:rgba(240,185,11,.3); background:rgba(240,185,11,.06)}
  .badge.listed{color:var(--pending); border-color:rgba(107,167,255,.35); background:rgba(107,167,255,.08)}
  .sale-meta{display:flex; justify-content:space-between; gap:12px; margin-top:12px; font-family:var(--mono); font-size:12px; color:var(--muted)}
  .bar{height:6px; background:var(--panel-2); border-radius:6px; overflow:hidden; margin-top:10px; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
  .sale-creator{font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:10px}

  /* detail */
  .back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:16px; cursor:pointer}
  .back:hover{color:var(--ink)}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px}
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
  .title-row h2{font-size:20px; margin:0}
  .kv{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:8px 0; border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:var(--mono); color:var(--ink); text-align:right; word-break:break-all}
  label{display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px}
  .field{margin-bottom:14px}
  .row{display:flex; gap:12px}
  .row>.field{flex:1}
  input{width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:14px; padding:11px 12px; border-radius:9px; outline:none}
  input:focus{border-color:var(--gold-dim)}
  .hint{font-size:12px; color:var(--muted); margin-top:8px}
  .status{display:flex; align-items:center; gap:9px; font-size:13px; font-family:var(--mono); margin-top:12px}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.pending{background:var(--pending)}
  .empty{background:var(--panel); border:1px dashed var(--line); border-radius:14px; padding:28px; text-align:center; color:var(--muted); font-size:14px}

  /* project info */
  .meta-logo{width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid var(--line); margin-bottom:14px; display:block}
  .meta-block{margin:0 0 16px}
  .meta-block:last-child{margin-bottom:0}
  .meta-block h3{font-size:12.5px; color:var(--muted); font-weight:600; margin:0 0 5px}
  .meta-block p{margin:0; font-size:14px; color:var(--ink); white-space:pre-wrap; line-height:1.6}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:7px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--gold)}
  .chip:hover{border-color:var(--gold-dim)}
  textarea{width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:14px; padding:11px 12px; border-radius:9px; outline:none; resize:vertical; min-height:70px; line-height:1.5}
  textarea:focus{border-color:var(--gold-dim)}
  .owner-tag{font-size:11px; font-weight:600; color:var(--gold); border:1px solid rgba(240,185,11,.3); background:rgba(240,185,11,.06); padding:3px 9px; border-radius:20px}

  details.cfg{margin-top:22px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2)}
  details.cfg summary{cursor:pointer; padding:12px 16px; font-size:13px; color:var(--muted); user-select:none}
  details.cfg .body{padding:4px 16px 16px}
  input.mono{font-family:var(--mono); font-size:12.5px}
  .note{font-size:12px; color:var(--muted); margin-top:10px}

  /* manual verify panel */
  .divider{display:flex; align-items:center; gap:12px; margin:22px 0 6px; color:var(--faint); font-size:12px}
  .divider::before,.divider::after{content:""; height:1px; background:var(--line); flex:1}
  .manual{margin-top:8px}
  .code-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0 6px}
  .code-head span{font-size:12.5px; color:var(--muted)}
  .copy{font-family:var(--sans); font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); padding:5px 11px; border-radius:8px; cursor:pointer}
  .copy:hover{border-color:#33406a}
  .copy.done{color:var(--ok); border-color:rgba(61,220,132,.4)}
  pre.code, textarea.code{width:100%; background:#070a12; border:1px solid var(--line); border-radius:10px; color:#c7d2ea; font-family:var(--mono); font-size:11.5px; line-height:1.55; padding:12px 14px; margin:0; overflow:auto; max-height:280px; white-space:pre; tab-size:2}
  textarea.code{resize:vertical; min-height:120px}
  .link-out{font-family:var(--mono); font-size:12.5px}

  /* toasts */
  #toasts{position:fixed; z-index:9999; right:16px; bottom:16px; display:flex; flex-direction:column; gap:10px; width:min(360px, calc(100vw - 32px))}
  @media (max-width:520px){ #toasts{left:12px; right:12px; width:auto; bottom:calc(12px + env(safe-area-inset-bottom,0px))} }
  .toast{background:var(--panel); border:1px solid var(--line); border-left-width:3px; border-radius:12px; padding:12px 12px 12px 13px; box-shadow:0 10px 34px rgba(0,0,0,.45); display:flex; gap:10px; align-items:flex-start}
  .toast.pending{border-left-color:var(--pending)} .toast.success{border-left-color:var(--ok)} .toast.error{border-left-color:var(--bad)} .toast.info{border-left-color:var(--muted)}
  .toast .ic{flex:none; width:18px; height:18px; margin-top:1px; display:grid; place-items:center; font-size:13px; font-weight:700}
  .toast.success .ic{color:var(--ok)} .toast.error .ic{color:var(--bad)} .toast.info .ic{color:var(--muted)}
  .toast .ic .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--pending);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.toast .ic .spin{animation:none}}
  .toast .body{flex:1; min-width:0}
  .toast .t{font-size:13px; font-weight:600; line-height:1.35; word-break:break-word}
  .toast .lnk{margin-top:3px}
  .toast a.tx{font-family:var(--mono); font-size:11.5px; color:var(--gold)}
  .toast .x{flex:none; background:none; border:0; color:var(--faint); font-size:17px; line-height:1; cursor:pointer; padding:0 2px}
  .foot{margin-top:26px; font-size:11.5px; color:#4a5674; text-align:center; line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◆</div>
      <div>
        <h1>ICO Launchpad</h1>
        <p>Browse token sales, buy in, claim later.</p>
      </div>
    </div>
    <div class="net-wrap">
      <button class="btn ghost sm" id="hdrAdminBtn" style="display:none">⚙ Admin</button>
      <button class="btn gold sm" id="connectBtn">Connect wallet</button>
      <div class="net" id="net" style="display:none"></div>
    </div>
  </header>

  <div id="view"></div>

  <p class="foot">Each token sale is an independent escrow contract. Liquidity is burned at listing.</p>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const ERC20_ABI = [
  "function name() view returns (string)",
  "function symbol() view returns (string)",
  "function decimals() view returns (uint8)",
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)"
];
const FACTORY_ABI = [
  "function totalICOs() view returns (uint256)",
  "function icos(uint256) view returns (address)",
  "function owner() view returns (address)",
  "function creationFee() view returns (uint256)",
  "function feeWallet() view returns (address)",
  "function feeKaviBps() view returns (uint256)",
  "function buyKaviBps() view returns (uint256)",
  "function maxCreatorBps() view returns (uint256)",
  "function paymentToken() view returns (address)",
  "function router() view returns (address)",
  "function kavi() view returns (address)",
  "function reserve() view returns (address)",
  "function quoteCreationKavi() view returns (uint256 kaviPartUsdt, uint256 expectedKavi)",
  "function launchICO((address saleToken,uint256 price,uint256 listingPrice,uint256 tokensForSale,uint256 liquidityTokens,uint256 startTime,uint256 endTime,uint256 minBuy,uint256 maxBuy,uint256 tgeBps,uint256 cliff,uint256 vesting,uint256 buyCreatorBps) p, uint256 minKaviOut) returns (address)",
  "function setCreationFee(uint256)",
  "function setFeeWallet(address)",
  "function setFeeKaviBps(uint256)",
  "function setBuyKaviBps(uint256)",
  "function setMaxCreatorBps(uint256)",
  "function transferOwnership(address)",
  "event ICOLaunched(address indexed creator, address indexed ico, address indexed saleToken, uint256 tokensForSale, uint256 liquidityTokens)"
];
const ICO_ABI = [
  "function saleToken() view returns (address)",
  "function paymentToken() view returns (address)",
  "function owner() view returns (address)",
  "function getSaleInfo() view returns (tuple(address saleToken,address paymentToken,address creator,uint256 price,uint256 listingPrice,uint256 tokensForSale,uint256 liquidityTokens,uint256 totalSold,uint256 totalRaised,uint256 startTime,uint256 endTime,uint256 minBuy,uint256 maxBuy,uint256 tgeBps,uint256 cliff,uint256 vesting,uint256 releaseStart,uint256 buyCreatorBps,uint256 buyKaviBps,uint256 remaining,bool funded,bool listed,uint8 saleDecimals,uint8 phase))",
  "function getUserInfo(address) view returns (tuple(uint256 purchased,uint256 contributed,uint256 claimed,uint256 vested,uint256 claimable))",
  "function purchased(address) view returns (uint256)",
  "function claimed(address) view returns (uint256)",
  "function claimable(address) view returns (uint256)",
  "function totalSold() view returns (uint256)",
  "function tokensForSale() view returns (uint256)",
  "function listed() view returns (bool)",
  "function startTime() view returns (uint256)",
  "function endTime() view returns (uint256)",
  "function quoteKaviOut(uint256) view returns (uint256 kaviFeeUsdt, uint256 expectedKavi)",
  "function buy(uint256 paymentAmount, uint256 minKaviOut)",
  "function claim()",
  "function listOnDex()"
];
const METADATA_ABI = [
  "function getAllMetadata(address ico) view returns (string[] keys, string[] values)",
  "function setMetadataBatch(address ico, string[] keys, string[] values)"
];

const CONFIG = {
  Factory: "0x02010cC851e1377A667fE7314406b75afe891F93",
  Metadata: "0xE1adF4D74eD5045F174b1532F37d236f00a980cC",
  Usdt: "0x55d398326f99059fF775485246999027B3197955",
  Chain: "56",
  Explorer: "https://bscscan.com",
  Rpc: "https://bsc-dataseed.binance.org"
};
function cfg(k){ return CONFIG[k]; }
const short = a => a ? a.slice(0,6)+"…"+a.slice(-4) : "—";

// ---------- providers ----------
let readProvider, signer, account;
function getRead(){
  if(!readProvider){ try{ readProvider = new ethers.JsonRpcProvider(cfg("Rpc")); }catch(e){ readProvider=null; } }
  return readProvider;
}

// ---------- error + toasts ----------
function clean(s){ s=String(s||"").trim(); return s.length>180?s.slice(0,177)+"…":s; }
function parseErr(e){
  if(!e) return "Something went wrong.";
  const code = e.code || (e.info && e.info.error && e.info.error.code);
  if(code==="ACTION_REJECTED"||code===4001) return "You rejected the request in your wallet.";
  if(code==="INSUFFICIENT_FUNDS") return "Not enough BNB to cover gas.";
  if(e.reason) return "Reverted: "+clean(e.reason);
  const n=(e.info&&e.info.error&&e.info.error.message)||(e.error&&e.error.message);
  if(n) return clean(n);
  if(e.shortMessage) return clean(e.shortMessage);
  if(e.message) return clean(e.message);
  return "Transaction failed.";
}
function icFor(k){ return k==="pending"?'<span class="spin"></span>':k==="success"?"✓":k==="error"?"✕":"ℹ"; }
function paintToast(el,o){
  if(o.kind){ el.className="toast "+o.kind; el.querySelector(".ic").innerHTML=icFor(o.kind); }
  if(o.title!==undefined) el.querySelector(".t").textContent=o.title;
  if(o.hash!==undefined){ const l=el.querySelector(".lnk"); l.innerHTML=""; if(o.hash){ const a=document.createElement("a"); a.className="tx"; a.href=cfg("Explorer").replace(/\/$/,"")+"/tx/"+o.hash; a.target="_blank"; a.rel="noopener"; a.textContent="View on BscScan ↗"; l.appendChild(a); } }
}
function showToast(o){
  const el=document.createElement("div"); el.className="toast "+(o.kind||"info");
  el.innerHTML='<div class="ic"></div><div class="body"><div class="t"></div><div class="lnk"></div></div><button class="x">×</button>';
  $("toasts").appendChild(el);
  const api={el,_t:null, update(u){ paintToast(el,u); if(u.sticky===false) this._a(u.kind); return this; }, dismiss(){ clearTimeout(this._t); el.remove(); }, _a(k){ clearTimeout(this._t); this._t=setTimeout(()=>el.remove(), k==="error"?9000:6000); }};
  el.querySelector(".x").onclick=()=>api.dismiss();
  paintToast(el,{kind:o.kind||"info",title:o.title||"",hash:o.hash||""});
  if(!o.sticky) api._a(o.kind);
  return api;
}
async function runTx(build, labels){
  labels=labels||{};
  const t=showToast({kind:"pending",title:labels.confirm||"Confirm in your wallet…",sticky:true});
  try{
    const tx=await build();
    t.update({kind:"pending",title:labels.submitted||"Transaction submitted",hash:tx.hash});
    const r=await tx.wait();
    if(r&&r.status===0) throw new Error("Transaction reverted on-chain.");
    t.update({kind:"success",title:labels.success||"Done",hash:tx.hash,sticky:false});
    return r;
  }catch(e){ t.update({kind:"error",title:parseErr(e),sticky:false}); throw e; }
}

// ---------- BscScan verification (same flow as the token launcher) ----------
// The ICO contract is deployed INSIDE the factory, so this front-end can't know its
// source or constructor layout on its own. Fill these in once and every new ICO will
// auto-verify after launch. Until Source is pasted, the app shows the manual steps.
const VERIFY = {
  Url: "https://ico-verify-proxy.myico.workers.dev", // your Cloudflare Worker proxy
  ContractName: "TokenICO",                            // the ICO contract name BscScan should match
  CompilerVersion: "v0.8.28+commit.7893614a",
  Optimization: true,
  Runs: 200,
  License: "MIT (3)",
  // >>> PASTE THE ICO CONTRACT SOURCE THAT YOUR FACTORY DEPLOYS (single-file) <<<
  Source: `// SPDX-License-Identifier: MIT
pragma solidity 0.8.28;

interface IERC20 {
    function transfer(address to, uint256 amount) external returns (bool);
    function transferFrom(address from, address to, uint256 amount) external returns (bool);
    function balanceOf(address account) external view returns (uint256);
    function decimals() external view returns (uint8);
}

interface IPancakeRouter {
    function addLiquidity(
        address tokenA, address tokenB,
        uint256 amountADesired, uint256 amountBDesired,
        uint256 amountAMin, uint256 amountBMin,
        address to, uint256 deadline
    ) external returns (uint256 amountA, uint256 amountB, uint256 liquidity);
    function swapExactTokensForTokens(
        uint256 amountIn, uint256 amountOutMin,
        address[] calldata path, address to, uint256 deadline
    ) external returns (uint256[] memory amounts);
    function getAmountsOut(uint256 amountIn, address[] calldata path)
        external view returns (uint256[] memory amounts);
}

interface ITranceReserve {
    function donate(uint256 amount) external;
}

contract TokenICO {
    struct SaleParams {
        address saleToken;
        address paymentToken;
        address router;
        address kavi;
        address reserve;
        uint256 price;
        uint256 listingPrice;
        uint256 tokensForSale;
        uint256 liquidityTokens;
        uint256 startTime;
        uint256 endTime;
        uint256 minBuy;
        uint256 maxBuy;
        uint256 tgeBps;
        uint256 cliff;
        uint256 vesting;
        uint256 buyCreatorBps;
        uint256 buyKaviBps;
    }

    struct SaleInfo {
        address saleToken;
        address paymentToken;
        address creator;
        uint256 price;
        uint256 listingPrice;
        uint256 tokensForSale;
        uint256 liquidityTokens;
        uint256 totalSold;
        uint256 totalRaised;
        uint256 startTime;
        uint256 endTime;
        uint256 minBuy;
        uint256 maxBuy;
        uint256 tgeBps;
        uint256 cliff;
        uint256 vesting;
        uint256 releaseStart;
        uint256 buyCreatorBps;
        uint256 buyKaviBps;
        uint256 remaining;
        bool funded;
        bool listed;
        uint8 saleDecimals;
        uint8 phase;
    }

    struct UserInfo {
        uint256 purchased;
        uint256 contributed;
        uint256 claimed;
        uint256 vested;
        uint256 claimable;
    }

    address public owner;
    address public immutable factory;
    address public immutable saleToken;
    address public immutable paymentToken;
    address public immutable router;
    address public immutable kavi;
    address public immutable reserve;
    uint8 public immutable saleDecimals;

    uint256 public immutable price;
    uint256 public immutable listingPrice;
    uint256 public immutable tokensForSale;
    uint256 public immutable liquidityTokens;
    uint256 public immutable startTime;
    uint256 public immutable endTime;
    uint256 public immutable minBuy;
    uint256 public immutable maxBuy;
    uint256 public immutable tgeBps;
    uint256 public immutable cliff;
    uint256 public immutable vesting;
    uint256 public immutable buyCreatorBps;
    uint256 public immutable buyKaviBps;
    uint256 private immutable _scale;
    uint256 public releaseStart;

    uint256 public totalSold;
    uint256 public totalRaised;
    bool public funded;
    bool public listed;

    mapping(address => uint256) public purchased;
    mapping(address => uint256) public contributed;
    mapping(address => uint256) public claimed;

    uint256 public constant BPS = 10_000;
    address public constant DEAD = 0x000000000000000000000000000000000000dEaD;
    uint256 private _locked = 1;

    event TokensFunded(uint256 saleTokens, uint256 liquidityTokens);
    event Purchased(address indexed buyer, uint256 paymentIn, uint256 tokensOut, uint256 creatorFee, uint256 kaviFee);
    event KaviReserved(uint256 usdtIn, uint256 kaviDonated);
    event Listed(address indexed caller, uint256 tokensToLp, uint256 usdtToLp, uint256 releaseStart);
    event LiquidityBurned(uint256 lpTokens);
    event BuybackBurned(uint256 usdtIn, uint256 tokensBurned);
    event UnsoldReturned(address indexed creator, uint256 saleTokens);
    event Claimed(address indexed buyer, uint256 amount);
    event OwnershipTransferred(address indexed oldOwner, address indexed newOwner);

    modifier onlyOwner() { require(msg.sender == owner, "not owner"); _; }
    modifier nonReentrant() { require(_locked == 1, "reentrant"); _locked = 2; _; _locked = 1; }

    constructor(SaleParams memory p, address _owner, address _factory) {
        require(p.saleToken != address(0) && p.paymentToken != address(0) && p.router != address(0), "zero addr");
        require(p.kavi != address(0) && p.reserve != address(0), "zero kavi");
        require(_owner != address(0), "owner=0");
        require(p.price > 0 && p.listingPrice > 0, "price=0");
        require(p.tokensForSale > 0 && p.liquidityTokens > 0, "amount=0");
        require(p.endTime > p.startTime && p.endTime > block.timestamp, "bad time");
        require(p.tgeBps <= BPS, "tge>100%");
        require(p.tgeBps == BPS || p.vesting > 0, "vesting=0");
        require(p.buyCreatorBps + p.buyKaviBps <= BPS, "fees>100%");

        saleToken = p.saleToken;
        paymentToken = p.paymentToken;
        router = p.router;
        kavi = p.kavi;
        reserve = p.reserve;
        saleDecimals = IERC20(p.saleToken).decimals();

        price = p.price;
        listingPrice = p.listingPrice;
        tokensForSale = p.tokensForSale;
        liquidityTokens = p.liquidityTokens;
        startTime = p.startTime;
        endTime = p.endTime;
        minBuy = p.minBuy;
        maxBuy = p.maxBuy;
        tgeBps = p.tgeBps;
        cliff = p.cliff;
        vesting = p.vesting;
        buyCreatorBps = p.buyCreatorBps;
        buyKaviBps = p.buyKaviBps;
        _scale = 10 ** uint256(saleDecimals);

        owner = _owner;
        factory = _factory;
        emit OwnershipTransferred(address(0), _owner);
    }

    function onFunded() external {
        require(msg.sender == factory, "only factory");
        require(!funded, "funded");
        require(IERC20(saleToken).balanceOf(address(this)) >= tokensForSale + liquidityTokens, "escrow short");
        funded = true;
        emit TokensFunded(tokensForSale, liquidityTokens);
    }

    function buy(uint256 paymentAmount, uint256 minKaviOut) external nonReentrant {
        require(funded, "not funded");
        require(block.timestamp >= startTime, "not started");
        require(block.timestamp <= endTime && !listed, "ended");
        require(paymentAmount > 0, "amount=0");

        uint256 newContrib = contributed[msg.sender] + paymentAmount;
        if (minBuy > 0) require(newContrib >= minBuy, "below min");
        if (maxBuy > 0) require(newContrib <= maxBuy, "above max");

        uint256 tokensOut = (paymentAmount * _scale) / price;
        require(tokensOut > 0, "too small");
        require(totalSold + tokensOut <= tokensForSale, "not enough left");

        _safeTransferFrom(paymentToken, msg.sender, address(this), paymentAmount);

        uint256 creatorFee = (paymentAmount * buyCreatorBps) / BPS;
        uint256 kaviFee = (paymentAmount * buyKaviBps) / BPS;
        uint256 retained = paymentAmount - creatorFee - kaviFee;

        if (creatorFee > 0) _safeTransfer(paymentToken, owner, creatorFee);
        if (kaviFee > 0) _buyKaviAndDonate(kaviFee, minKaviOut);

        purchased[msg.sender] += tokensOut;
        contributed[msg.sender] = newContrib;
        totalSold += tokensOut;
        totalRaised += retained;
        emit Purchased(msg.sender, paymentAmount, tokensOut, creatorFee, kaviFee);
    }

    function listOnDex() external nonReentrant {
        require(funded, "not funded");
        require(!listed, "listed");
        require(block.timestamp > endTime, "sale live");

        listed = true;
        releaseStart = block.timestamp;

        if (totalRaised > 0) {
            uint256 usdtToLp = (liquidityTokens * listingPrice) / _scale;
            uint256 tokensToLp = liquidityTokens;
            if (totalRaised < usdtToLp) {
                usdtToLp = totalRaised;
                tokensToLp = (totalRaised * _scale) / listingPrice;
            }

            _safeApprove(saleToken, router, tokensToLp);
            _safeApprove(paymentToken, router, usdtToLp);
            ( , , uint256 lp) = IPancakeRouter(router).addLiquidity(
                saleToken, paymentToken, tokensToLp, usdtToLp,
                (tokensToLp * 95) / 100, (usdtToLp * 95) / 100, DEAD, block.timestamp
            );
            emit Listed(msg.sender, tokensToLp, usdtToLp, releaseStart);
            emit LiquidityBurned(lp);

            uint256 usdtLeft = IERC20(paymentToken).balanceOf(address(this));
            if (usdtLeft > 0) {
                _safeApprove(paymentToken, router, usdtLeft);
                address[] memory path = new address[](2);
                path[0] = paymentToken;
                path[1] = saleToken;
                uint256[] memory outs = IPancakeRouter(router).swapExactTokensForTokens(
                    usdtLeft, 0, path, DEAD, block.timestamp
                );
                emit BuybackBurned(usdtLeft, outs[outs.length - 1]);
            }
        } else {
            emit Listed(msg.sender, 0, 0, releaseStart);
        }

        uint256 saleBal = IERC20(saleToken).balanceOf(address(this));
        uint256 toCreator = saleBal > totalSold ? saleBal - totalSold : 0;
        if (toCreator > 0) { _safeTransfer(saleToken, owner, toCreator); emit UnsoldReturned(owner, toCreator); }
    }

    function claim() external nonReentrant {
        require(listed, "not listed");
        require(block.timestamp >= releaseStart, "not started");
        uint256 vested = _vested(purchased[msg.sender], block.timestamp);
        uint256 releasable = vested - claimed[msg.sender];
        require(releasable > 0, "nothing to claim");
        claimed[msg.sender] += releasable;
        _safeTransfer(saleToken, msg.sender, releasable);
        emit Claimed(msg.sender, releasable);
    }

    function transferOwnership(address newOwner) external onlyOwner {
        require(newOwner != address(0), "owner=0");
        emit OwnershipTransferred(owner, newOwner);
        owner = newOwner;
    }

    function _buyKaviAndDonate(uint256 usdtAmount, uint256 minKaviOut) internal {
        _safeApprove(paymentToken, router, usdtAmount);
        address[] memory path = new address[](2);
        path[0] = paymentToken;
        path[1] = kavi;
        uint256 before = IERC20(kavi).balanceOf(address(this));
        IPancakeRouter(router).swapExactTokensForTokens(usdtAmount, minKaviOut, path, address(this), block.timestamp);
        uint256 got = IERC20(kavi).balanceOf(address(this)) - before;
        if (got > 0) {
            _safeApprove(kavi, reserve, got);
            ITranceReserve(reserve).donate(got);
            emit KaviReserved(usdtAmount, got);
        }
    }

    function quoteKaviOut(uint256 paymentAmount) external view returns (uint256 kaviFeeUsdt, uint256 expectedKavi) {
        kaviFeeUsdt = (paymentAmount * buyKaviBps) / BPS;
        if (kaviFeeUsdt == 0) return (0, 0);
        address[] memory path = new address[](2);
        path[0] = paymentToken;
        path[1] = kavi;
        uint256[] memory outs = IPancakeRouter(router).getAmountsOut(kaviFeeUsdt, path);
        expectedKavi = outs[outs.length - 1];
    }

    function _vested(uint256 amount, uint256 t) internal view returns (uint256) {
        if (releaseStart == 0 || t < releaseStart) return 0;
        uint256 tge = (amount * tgeBps) / BPS;
        uint256 vestStart = releaseStart + cliff;
        if (t < vestStart) return tge;
        uint256 elapsed = t - vestStart;
        if (elapsed >= vesting) return amount;
        return tge + ((amount - tge) * elapsed) / vesting;
    }

    function claimable(address user) external view returns (uint256) {
        if (!listed || block.timestamp < releaseStart) return 0;
        return _vested(purchased[user], block.timestamp) - claimed[user];
    }
    function vestedOf(address user) external view returns (uint256) {
        return _vested(purchased[user], block.timestamp);
    }
    function remainingForSale() external view returns (uint256) { return tokensForSale - totalSold; }
    function saleLive() external view returns (bool) {
        return funded && !listed && block.timestamp >= startTime && block.timestamp <= endTime;
    }

    function phase() public view returns (uint8) {
        if (listed) return 3;
        if (block.timestamp < startTime) return 0;
        if (block.timestamp <= endTime) return 1;
        return 2;
    }

    function getSaleInfo() public view returns (SaleInfo memory info) {
        info = SaleInfo({
            saleToken: saleToken,
            paymentToken: paymentToken,
            creator: owner,
            price: price,
            listingPrice: listingPrice,
            tokensForSale: tokensForSale,
            liquidityTokens: liquidityTokens,
            totalSold: totalSold,
            totalRaised: totalRaised,
            startTime: startTime,
            endTime: endTime,
            minBuy: minBuy,
            maxBuy: maxBuy,
            tgeBps: tgeBps,
            cliff: cliff,
            vesting: vesting,
            releaseStart: releaseStart,
            buyCreatorBps: buyCreatorBps,
            buyKaviBps: buyKaviBps,
            remaining: tokensForSale - totalSold,
            funded: funded,
            listed: listed,
            saleDecimals: saleDecimals,
            phase: phase()
        });
    }

    function getUserInfo(address user) external view returns (UserInfo memory u) {
        uint256 v = _vested(purchased[user], block.timestamp);
        u = UserInfo({
            purchased: purchased[user],
            contributed: contributed[user],
            claimed: claimed[user],
            vested: v,
            claimable: (listed && block.timestamp >= releaseStart) ? v - claimed[user] : 0
        });
    }

    function _safeTransfer(address token, address to, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0xa9059cbb, to, amount), "transfer failed");
    }
    function _safeTransferFrom(address token, address from, address to, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0x23b872dd, from, to, amount), "transferFrom failed");
    }
    function _safeApprove(address token, address spender, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0x095ea7b3, spender, uint256(0)), "approve0 failed");
        if (amount > 0) _call(token, abi.encodeWithSelector(0x095ea7b3, spender, amount), "approve failed");
    }
    function _call(address token, bytes memory data, string memory errMsg) private {
        (bool ok, bytes memory ret) = token.call(data);
        require(ok && (ret.length == 0 || abi.decode(ret, (bool))), errMsg);
    }
}

contract ICOFactory {
    struct LaunchParams {
        address saleToken;
        uint256 price;
        uint256 listingPrice;
        uint256 tokensForSale;
        uint256 liquidityTokens;
        uint256 startTime;
        uint256 endTime;
        uint256 minBuy;
        uint256 maxBuy;
        uint256 tgeBps;
        uint256 cliff;
        uint256 vesting;
        uint256 buyCreatorBps;
    }

    address public owner;
    address public immutable paymentToken;
    address public immutable router;
    address public immutable kavi;
    address public immutable reserve;

    address public feeWallet;
    uint256 public creationFee;
    uint256 public feeKaviBps;
    uint256 public buyKaviBps;
    uint256 public maxCreatorBps;

    address[] public icos;
    mapping(address => address[]) public icosByCreator;

    uint256 public constant BPS = 10_000;

    event ICOLaunched(address indexed creator, address indexed ico, address indexed saleToken, uint256 tokensForSale, uint256 liquidityTokens);
    event CreationFeeCollected(address indexed creator, uint256 toWallet, uint256 toKavi, uint256 kaviDonated);
    event CreationFeeUpdated(uint256 oldFee, uint256 newFee);
    event FeeWalletUpdated(address oldWallet, address newWallet);
    event FeeKaviBpsUpdated(uint256 oldBps, uint256 newBps);
    event BuyKaviBpsUpdated(uint256 oldBps, uint256 newBps);
    event MaxCreatorBpsUpdated(uint256 oldBps, uint256 newBps);
    event OwnershipTransferred(address indexed oldOwner, address indexed newOwner);

    modifier onlyOwner() { require(msg.sender == owner, "not owner"); _; }

    constructor(
        address _paymentToken,
        address _router,
        address _kavi,
        address _reserve,
        address _feeWallet,
        uint256 _creationFee,
        address _owner
    ) {
        require(_paymentToken != address(0) && _router != address(0) && _kavi != address(0)
            && _reserve != address(0) && _feeWallet != address(0) && _owner != address(0), "zero addr");
        paymentToken = _paymentToken;
        router = _router;
        kavi = _kavi;
        reserve = _reserve;
        feeWallet = _feeWallet;
        creationFee = _creationFee;
        feeKaviBps = 5000;
        buyKaviBps = 500;
        maxCreatorBps = 2000;
        owner = _owner;
        emit OwnershipTransferred(address(0), _owner);
    }

    function launchICO(LaunchParams calldata p, uint256 minKaviOut) external returns (address icoAddress) {
        require(p.buyCreatorBps <= maxCreatorBps, "creator fee too high");

        if (creationFee > 0) {
            _safeTransferFrom(paymentToken, msg.sender, address(this), creationFee);
            uint256 kaviPart = (creationFee * feeKaviBps) / BPS;
            uint256 walletPart = creationFee - kaviPart;
            if (walletPart > 0) _safeTransfer(paymentToken, feeWallet, walletPart);
            uint256 donated = 0;
            if (kaviPart > 0) donated = _buyKaviAndDonate(kaviPart, minKaviOut);
            emit CreationFeeCollected(msg.sender, walletPart, kaviPart, donated);
        }

        TokenICO.SaleParams memory sp = TokenICO.SaleParams({
            saleToken: p.saleToken,
            paymentToken: paymentToken,
            router: router,
            kavi: kavi,
            reserve: reserve,
            price: p.price,
            listingPrice: p.listingPrice,
            tokensForSale: p.tokensForSale,
            liquidityTokens: p.liquidityTokens,
            startTime: p.startTime,
            endTime: p.endTime,
            minBuy: p.minBuy,
            maxBuy: p.maxBuy,
            tgeBps: p.tgeBps,
            cliff: p.cliff,
            vesting: p.vesting,
            buyCreatorBps: p.buyCreatorBps,
            buyKaviBps: buyKaviBps
        });
        TokenICO ico = new TokenICO(sp, msg.sender, address(this));
        icoAddress = address(ico);

        uint256 total = p.tokensForSale + p.liquidityTokens;
        uint256 balBefore = IERC20(p.saleToken).balanceOf(icoAddress);
        _safeTransferFrom(p.saleToken, msg.sender, icoAddress, total);
        require(IERC20(p.saleToken).balanceOf(icoAddress) - balBefore >= total, "fund short");
        ico.onFunded();

        icos.push(icoAddress);
        icosByCreator[msg.sender].push(icoAddress);
        emit ICOLaunched(msg.sender, icoAddress, p.saleToken, p.tokensForSale, p.liquidityTokens);
    }

    function setCreationFee(uint256 newFee) external onlyOwner {
        emit CreationFeeUpdated(creationFee, newFee); creationFee = newFee;
    }
    function setFeeWallet(address newWallet) external onlyOwner {
        require(newWallet != address(0), "wallet=0");
        emit FeeWalletUpdated(feeWallet, newWallet); feeWallet = newWallet;
    }
    function setFeeKaviBps(uint256 newBps) external onlyOwner {
        require(newBps <= BPS, "bps>100%");
        emit FeeKaviBpsUpdated(feeKaviBps, newBps); feeKaviBps = newBps;
    }
    function setBuyKaviBps(uint256 newBps) external onlyOwner {
        require(newBps + maxCreatorBps <= BPS, "fees>100%");
        emit BuyKaviBpsUpdated(buyKaviBps, newBps); buyKaviBps = newBps;
    }
    function setMaxCreatorBps(uint256 newBps) external onlyOwner {
        require(newBps + buyKaviBps <= BPS, "fees>100%");
        emit MaxCreatorBpsUpdated(maxCreatorBps, newBps); maxCreatorBps = newBps;
    }
    function transferOwnership(address newOwner) external onlyOwner {
        require(newOwner != address(0), "owner=0");
        emit OwnershipTransferred(owner, newOwner); owner = newOwner;
    }

    function totalICOs() external view returns (uint256) { return icos.length; }
    function getICOsByCreator(address creator) external view returns (address[] memory) {
        return icosByCreator[creator];
    }
    function getICOsByCreatorCount(address creator) external view returns (uint256) {
        return icosByCreator[creator].length;
    }

    function getAllICOs() external view returns (address[] memory) { return icos; }

    function getICOs(uint256 start, uint256 count) external view returns (address[] memory page) {
        uint256 n = icos.length;
        if (start >= n) return new address[](0);
        uint256 end = start + count;
        if (end > n) end = n;
        page = new address[](end - start);
        for (uint256 i = start; i < end;) { page[i - start] = icos[i]; unchecked { ++i; } }
    }

    function getSaleInfos(uint256 start, uint256 count)
        external view returns (address[] memory list, TokenICO.SaleInfo[] memory infos)
    {
        uint256 n = icos.length;
        if (start >= n) return (new address[](0), new TokenICO.SaleInfo[](0));
        uint256 end = start + count;
        if (end > n) end = n;
        uint256 len = end - start;
        list = new address[](len);
        infos = new TokenICO.SaleInfo[](len);
        for (uint256 i = 0; i < len;) {
            address a = icos[start + i];
            list[i] = a;
            infos[i] = TokenICO(a).getSaleInfo();
            unchecked { ++i; }
        }
    }

    function quoteCreationKavi() external view returns (uint256 kaviPartUsdt, uint256 expectedKavi) {
        kaviPartUsdt = (creationFee * feeKaviBps) / BPS;
        if (kaviPartUsdt == 0) return (0, 0);
        address[] memory path = new address[](2);
        path[0] = paymentToken;
        path[1] = kavi;
        uint256[] memory outs = IPancakeRouter(router).getAmountsOut(kaviPartUsdt, path);
        expectedKavi = outs[outs.length - 1];
    }

    function _buyKaviAndDonate(uint256 usdtAmount, uint256 minKaviOut) internal returns (uint256 got) {
        _safeApprove(paymentToken, router, usdtAmount);
        address[] memory path = new address[](2);
        path[0] = paymentToken;
        path[1] = kavi;
        uint256 before = IERC20(kavi).balanceOf(address(this));
        IPancakeRouter(router).swapExactTokensForTokens(usdtAmount, minKaviOut, path, address(this), block.timestamp);
        got = IERC20(kavi).balanceOf(address(this)) - before;
        if (got > 0) { _safeApprove(kavi, reserve, got); ITranceReserve(reserve).donate(got); }
    }
    function _safeTransfer(address token, address to, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0xa9059cbb, to, amount), "transfer failed");
    }
    function _safeTransferFrom(address token, address from, address to, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0x23b872dd, from, to, amount), "transferFrom failed");
    }
    function _safeApprove(address token, address spender, uint256 amount) internal {
        _call(token, abi.encodeWithSelector(0x095ea7b3, spender, uint256(0)), "approve0 failed");
        if (amount > 0) _call(token, abi.encodeWithSelector(0x095ea7b3, spender, amount), "approve failed");
    }
    function _call(address token, bytes memory data, string memory errMsg) private {
        (bool ok, bytes memory ret) = token.call(data);
        require(ok && (ret.length == 0 || abi.decode(ret, (bool))), errMsg);
    }
}
  `
};
function verifyConfigured(){
  return !!VERIFY.Url && !!VERIFY.Source && !/PASTE THE ICO CONTRACT SOURCE/.test(VERIFY.Source);
}
function encodeCtor(types, values){
  return ethers.AbiCoder.defaultAbiCoder().encode(types, values).slice(2); // strip 0x
}
// Rebuilds TokenICO's exact constructor args: constructor(SaleParams p, address _owner, address _factory).
// The factory injects paymentToken/router/kavi/reserve/buyKaviBps into SaleParams; the rest come from
// the launch form. _owner is the creator (msg.sender at launch), _factory is the factory address.
async function icoCtor(params, creator){
  const f=new ethers.Contract(cfg("Factory"), FACTORY_ABI, getRead());
  const [paymentToken, router, kavi, reserve, buyKaviBps]=await Promise.all([
    f.paymentToken(), f.router(), f.kavi(), f.reserve(), f.buyKaviBps()
  ]);
  const saleParams=[
    params.saleToken, paymentToken, router, kavi, reserve,
    params.price, params.listingPrice, params.tokensForSale, params.liquidityTokens,
    params.startTime, params.endTime, params.minBuy, params.maxBuy,
    params.tgeBps, params.cliff, params.vesting, params.buyCreatorBps, buyKaviBps
  ];
  return {
    types:[
      "tuple(address,address,address,address,address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)",
      "address","address"
    ],
    values:[ saleParams, creator, cfg("Factory") ]
  };
}
function wireCopy(scope){
  scope.querySelectorAll(".copy").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const el=$(btn.dataset.copy); const text=el.value!==undefined?el.value:el.textContent;
      try{ await navigator.clipboard.writeText(text); }
      catch(e){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      const old=btn.textContent; btn.textContent="Copied ✓"; btn.classList.add("done");
      setTimeout(()=>{ btn.textContent=old; btn.classList.remove("done"); },1500);
    });
  });
}
function vmsg(kind,text){ const b=$("vStatus"); if(!b) return; b.style.display="flex"; b.querySelector(".dot").className="dot "+(kind==="ok"?"ok":kind==="bad"?"bad":"pending"); $("vMsg").textContent=text; }

// Submits + polls BscScan, mirroring the token launcher's verify flow.
async function runVerifyICO(address, ctor){
  const retry=$("verifyAgainBtn");
  if(!verifyConfigured()){
    vmsg("bad","Auto-verify isn't configured yet — paste your ICO source & proxy URL in VERIFY, or use the manual steps below.");
    showToast({kind:"info",title:"Verification not configured — manual steps are ready below."});
    if(retry) retry.style.display="block";
    return false;
  }
  if(retry) retry.disabled=true;
  const vt=showToast({kind:"pending",title:"Submitting source to BscScan…",sticky:true});
  try{
    const encoded=encodeCtor(ctor.types, ctor.values);
    vmsg("pending","Submitting source to BscScan…");
    let submit;
    try{
      submit=await fetch(VERIFY.Url.replace(/\/$/,"")+"/verify",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chainid:cfg("Chain"), contractaddress:address, constructorArguments:encoded})
      });
    }catch(e){ throw new Error("Can't reach the verify proxy — check VERIFY.Url and that the worker is deployed."); }
    if(!submit.ok) throw new Error("Verify proxy returned HTTP "+submit.status+".");
    const sj=await submit.json();
    if(!sj.ok) throw new Error(sj.error||"Submit rejected.");
    const guid=sj.guid;
    vmsg("pending","Queued. Waiting for BscScan… ("+guid.slice(0,8)+")");
    vt.update({kind:"pending",title:"Queued on BscScan — compiling…"});

    let tries=0;
    while(tries<24){
      await new Promise(r=>setTimeout(r,5000)); tries++;
      let stj;
      try{
        const st=await fetch(VERIFY.Url.replace(/\/$/,"")+"/status?guid="+encodeURIComponent(guid)+"&chainid="+cfg("Chain"));
        stj=await st.json();
      }catch(e){ continue; } // transient hiccup — keep polling
      if(stj.pending){ vmsg("pending","Still compiling on BscScan… ("+tries+")"); continue; }
      if(stj.ok){
        vmsg("ok","Verified ✓");
        const url=cfg("Explorer")+"/address/"+address+"#code";
        const link=$("vLink"); if(link){ link.style.display="block"; link.innerHTML='<a class="link-out" href="'+url+'" target="_blank" rel="noopener">View verified source on BscScan →</a>'; }
        if(retry) retry.style.display="none";
        vt.update({kind:"success",title:"Contract verified ✓",sticky:false});
        return true;
      }
      throw new Error(stj.error||"Verification failed.");
    }
    vmsg("bad","Timed out. Check the contract page — it may still finish.");
    vt.update({kind:"error",title:"Verification timed out — it may still finish on BscScan.",sticky:false});
    if(retry){ retry.style.display="block"; retry.disabled=false; }
    return false;
  }catch(e){
    vmsg("bad", parseErr(e));
    vt.update({kind:"error",title:parseErr(e),sticky:false});
    if(retry){ retry.style.display="block"; retry.disabled=false; }
    return false;
  }
}

function currentIco(){ return new URLSearchParams(location.search).get("ico"); }
function goto(addr){
  const u=new URL(location.href);
  if(addr) u.searchParams.set("ico",addr); else u.searchParams.delete("ico");
  history.pushState({},"",u); render();
}
window.addEventListener("popstate", render);

function statusOf(s){
  const now=Math.floor(Date.now()/1000);
  if(s.listed) return {key:"listed",label:"Listed"};
  if(now < Number(s.startTime)) return {key:"",label:"Upcoming"};
  if(now <= Number(s.endTime)) return {key:"live",label:"Live"};
  return {key:"ended",label:"Ended"};
}

async function render(){
  const box=$("view");
  if(!cfg("Factory")){
    box.innerHTML='<div class="empty">Set your ICO factory address in Settings below to load the sales.</div>'; return;
  }
  const rp=getRead();
  if(!rp){ box.innerHTML='<div class="empty">Invalid RPC URL. Check Settings.</div>'; return; }

  const ico=currentIco();
  if(ico){ return renderDetail(ico); }
  if(new URLSearchParams(location.search).get("create")!==null){ return renderCreate(); }
  if(new URLSearchParams(location.search).get("admin")!==null){ return renderAdmin(); }

  box.innerHTML=dirHeader('…')+'<div class="empty">Loading sales…</div>';
  wireDirBtns();
  try{
    const factory=new ethers.Contract(cfg("Factory"), FACTORY_ABI, rp);
    const total=Number(await factory.totalICOs());
    if(total===0){ box.innerHTML=dirHeader(0)+'<div class="empty">No ICOs have been created yet. Be the first — tap “Create ICO”.</div>'; wireDirBtns(); return; }
    const addrs=[];
    for(let i=total-1;i>=0;i--) addrs.push(await factory.icos(i));
    const cards=await Promise.all(addrs.map(a=>saleCard(a, rp)));
    box.innerHTML=dirHeader(total)+cards.join("");
    wireDirBtns();
    box.querySelectorAll("a.sale").forEach(el=>{ el.addEventListener("click",ev=>{ ev.preventDefault(); goto(el.getAttribute("data-addr")); }); });
  }catch(e){ box.innerHTML=dirHeader('')+'<div class="empty">Could not read the factory — check the address, chain, and RPC.</div>'; wireDirBtns(); }
}

async function saleCard(addr, rp){
  try{
    const ico=new ethers.Contract(addr, ICO_ABI, rp);
    const [saleTok, sold, forSale, listed, startTime, endTime, ownerAddr] = await Promise.all([
      ico.saleToken(), ico.totalSold(), ico.tokensForSale(), ico.listed(), ico.startTime(), ico.endTime(), ico.owner()
    ]);
    const tok=new ethers.Contract(saleTok, ERC20_ABI, rp);
    const [name, sym, dec] = await Promise.all([tok.name(), tok.symbol(), tok.decimals()]);
    const st=statusOf({listed, startTime, endTime});
    const pct = forSale>0n ? Number((sold*10000n)/forSale)/100 : 0;
    const fmt=x=>Number(ethers.formatUnits(x, dec)).toLocaleString(undefined,{maximumFractionDigits:0});
    return '<a class="sale" href="?ico='+addr+'" data-addr="'+addr+'">'
      + '<div class="sale-top"><div class="sale-name">'+esc(name)+'<span class="sym">'+esc(sym)+' ICO</span></div>'
      + '<span class="badge '+st.key+'">'+st.label+'</span></div>'
      + '<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
      + '<div class="sale-meta"><span>'+fmt(sold)+' / '+fmt(forSale)+' sold</span><span>'+pct.toFixed(1)+'%</span></div>'
      + '<div class="sale-creator">by '+short(ownerAddr)+'</div></a>';
  }catch(e){
    return '<a class="sale" href="?ico='+addr+'" data-addr="'+addr+'"><div class="sale-name">Sale '+short(addr)+'</div><div class="sale-creator">tap to open</div></a>';
  }
}

  if(/^ipfs:\/\//i.test(v)) return "https://ipfs.io/ipfs/"+v.replace(/^ipfs:\/\//i,"");
  if(/^https?:\/\//i.test(v)) return v;
  return null;

async function doCreate(){
  if(!signer){ showToast({kind:"error",title:"Connect your wallet first."}); return; }
  const g=id=>$(id).value.trim();
  const tokenAddr=g("c_token");
  if(!ethers.isAddress(tokenAddr)){ cMsg("bad","Enter a valid sale token address."); return; }
  const priceF=parseFloat(g("c_price")), listF=parseFloat(g("c_listing"));
  const forSaleF=g("c_forsale"), liqF=g("c_liq");
  const startS=Math.floor(new Date(g("c_start")).getTime()/1000);
  const endS=Math.floor(new Date(g("c_end")).getTime()/1000);
  const minF=parseFloat(g("c_min")||"0"), maxF=parseFloat(g("c_max")||"0");
  const tgePct=parseFloat(g("c_tge")), cliffD=parseFloat(g("c_cliff")||"0"), vestD=parseFloat(g("c_vest")||"0");
  const feePct=parseFloat(g("c_fee")), slip=parseFloat(g("c_slip")||"0.5");

  if(!(priceF>0)||!(listF>0)){ cMsg("bad","Enter presale and listing prices."); return; }
  if(!(BigInt(forSaleF||"0")>0n)||!(BigInt(liqF||"0")>0n)){ cMsg("bad","Enter tokens for sale and for liquidity."); return; }
  if(!(endS>startS)||!(endS>Math.floor(Date.now()/1000))){ cMsg("bad","End must be after start and in the future."); return; }
  if(!(tgePct>=0&&tgePct<=100)){ cMsg("bad","TGE must be 0–100%."); return; }
  if(tgePct<100 && !(vestD>0)){ cMsg("bad","Set a vesting period (or 100% TGE)."); return; }
  if(!(feePct>=0)){ cMsg("bad","Enter your sell fee."); return; }

  try{
    cMsg("pending","Reading token & factory…");
    const rp=getRead();
    const factory=new ethers.Contract(cfg("Factory"), FACTORY_ABI, rp);
    const [creationFee, maxBps, payTok]=await Promise.all([factory.creationFee(), factory.maxCreatorBps(), factory.paymentToken()]);
    if(BigInt(Math.round(feePct*100)) > maxBps){ cMsg("bad","Your fee exceeds the max allowed ("+(Number(maxBps)/100)+"%)."); return; }
    const tok=new ethers.Contract(tokenAddr, ERC20_ABI, rp);
    const pay=new ethers.Contract(payTok, ERC20_ABI, rp);
    const [dec, ud]=await Promise.all([tok.decimals(), pay.decimals()]);
    const D=Number(dec), UD=Number(ud);

    const params={
      saleToken: tokenAddr,
      price: ethers.parseUnits(String(priceF), UD),
      listingPrice: ethers.parseUnits(String(listF), UD),
      tokensForSale: ethers.parseUnits(forSaleF, D),
      liquidityTokens: ethers.parseUnits(liqF, D),
      startTime: BigInt(startS),
      endTime: BigInt(endS),
      minBuy: minF>0 ? ethers.parseUnits(String(minF), UD) : 0n,
      maxBuy: maxF>0 ? ethers.parseUnits(String(maxF), UD) : 0n,
      tgeBps: BigInt(Math.round(tgePct*100)),
      cliff: BigInt(Math.round(cliffD*86400)),
      vesting: BigInt(Math.round(vestD*86400)),
      buyCreatorBps: BigInt(Math.round(feePct*100))
    };
    const totalTokens = params.tokensForSale + params.liquidityTokens;

    // 1) approve USDT creation fee
    if(creationFee > 0n){
      const usdtS=new ethers.Contract(payTok, ERC20_ABI, signer);
      if((await usdtS.allowance(account, cfg("Factory"))) < creationFee){
        await runTx(()=>usdtS.approve(cfg("Factory"), creationFee), {confirm:"Approve USDT fee — confirm…", submitted:"Approval submitted", success:"USDT fee approved"});
      }
    }
    // 2) approve sale tokens
    const tokS=new ethers.Contract(tokenAddr, ERC20_ABI, signer);
    if((await tokS.allowance(account, cfg("Factory"))) < totalTokens){
      await runTx(()=>tokS.approve(cfg("Factory"), totalTokens), {confirm:"Approve sale tokens — confirm…", submitted:"Approval submitted", success:"Sale tokens approved"});
    }
    // 3) minKaviOut for the creation-fee KAVI buy
    let minKaviOut=0n;
    try{
      const [part, expK]=await factory.quoteCreationKavi();
      if(part>0n){ const bps=BigInt(Math.round(Math.max(0,Math.min(50,slip))*100)); minKaviOut=(expK*(10000n-bps))/10000n; }
    }catch(e){ /* KAVI/USDT liquidity may be missing; proceed */ }

    // 4) launch
    const fSigner=new ethers.Contract(cfg("Factory"), FACTORY_ABI, signer);
    const rcpt=await runTx(()=>fSigner.launchICO(params, minKaviOut), {confirm:"Launch ICO — confirm in wallet…", submitted:"Launch submitted", success:"ICO created"});
    let newAddr=null;
    for(const log of rcpt.logs){ try{ const p=fSigner.interface.parseLog(log); if(p&&p.name==="ICOLaunched"){ newAddr=p.args.ico; break; } }catch(e){} }
    if(newAddr){
      showToast({kind:"success",title:"ICO live at "+short(newAddr)});
      const ctor=await icoCtor(params, account);
      renderLaunchResult(newAddr, ctor);     // show result + manual fallback
      await runVerifyICO(newAddr, ctor);      // then auto-verify on BscScan
    }
    else { cMsg("ok","Launched. Returning to the list…"); goto(null); }
  }catch(e){ cMsg("bad", parseErr(e)); }
}
function cMsg(kind,text){ const b=$("cStatus"); if(!b) return; b.style.display="flex"; b.querySelector(".dot").className="dot "+(kind==="bad"?"bad":kind==="ok"?"ok":"pending"); $("cMsg").textContent=text; }

// ---------- admin (factory owner only) ----------
async function renderAdmin(){
  const box=$("view"), rp=getRead();
  box.innerHTML='<span class="back" id="back">← All sales</span><div class="empty">Loading admin…</div>';
  $("back").onclick=()=>goto(null);
  try{
    const f=new ethers.Contract(cfg("Factory"), FACTORY_ABI, rp);
    const [owner, fee, wallet, feeKavi, buyKavi, maxCreator, payTok]=await Promise.all([
      f.owner(), f.creationFee(), f.feeWallet(), f.feeKaviBps(), f.buyKaviBps(), f.maxCreatorBps(), f.paymentToken()]);
    const pay=new ethers.Contract(payTok, ERC20_ABI, rp);
    const ud=Number(await pay.decimals());
    window.__adminUsdtDec=ud;
    const isOwner = account && account.toLowerCase()===owner.toLowerCase();
    if(!isOwner){
      box.innerHTML='<span class="back" id="back">← All sales</span><div class="empty">Admin controls are only available to the factory owner ('+short(owner)+').'+(account?'':' Connect that wallet to continue.')+'</div>';
      $("back").onclick=()=>goto(null); return;
    }
    const feeStr=ethers.formatUnits(fee, ud);
    box.innerHTML='<span class="back" id="back">← All sales</span>'
      + '<div class="panel"><div class="title-row"><h2>Factory admin</h2><span class="owner-tag">Owner</span></div>'
      + '<p class="hint" style="margin-top:0">Platform-wide settings. These affect future ICOs; already-created sales keep their own fixed values.</p>'

      + '<div class="field"><label>Creation fee (USDT)</label><div class="row" style="gap:8px"><input id="a_fee" type="number" min="0" step="0.01" value="'+feeStr+'" style="flex:1"/><button class="btn sm" id="a_feeBtn" style="flex:none">Update</button></div></div>'
      + '<div class="field"><label>Fee wallet</label><div class="row" style="gap:8px"><input id="a_wallet" class="mono" value="'+esc(wallet)+'" style="flex:1"/><button class="btn sm" id="a_walletBtn" style="flex:none">Update</button></div></div>'
      + '<div class="field"><label>Creation-fee KAVI split (%) — rest to fee wallet</label><div class="row" style="gap:8px"><input id="a_feeKavi" type="number" min="0" max="100" step="0.01" value="'+(Number(feeKavi)/100)+'" style="flex:1"/><button class="btn sm" id="a_feeKaviBtn" style="flex:none">Update</button></div></div>'
      + '<div class="field"><label>Per-buy KAVI reserve fee (%)</label><div class="row" style="gap:8px"><input id="a_buyKavi" type="number" min="0" max="100" step="0.01" value="'+(Number(buyKavi)/100)+'" style="flex:1"/><button class="btn sm" id="a_buyKaviBtn" style="flex:none">Update</button></div></div>'
      + '<div class="field"><label>Max creator fee cap (%)</label><div class="row" style="gap:8px"><input id="a_maxCreator" type="number" min="0" max="100" step="0.01" value="'+(Number(maxCreator)/100)+'" style="flex:1"/><button class="btn sm" id="a_maxCreatorBtn" style="flex:none">Update</button></div></div>'
      + '<div class="field" style="margin-bottom:0"><label>Transfer ownership (irreversible)</label><div class="row" style="gap:8px"><input id="a_owner" class="mono" placeholder="0x… new owner" style="flex:1"/><button class="btn sm" id="a_ownerBtn" style="flex:none">Transfer</button></div></div>'
      + '<div class="status" id="aStatus" style="display:none"><span class="dot"></span><span id="aMsg"></span></div></div>';
    $("back").onclick=()=>goto(null);
    wireAdmin();
  }catch(e){ box.innerHTML='<span class="back" id="back">← All sales</span><div class="empty">Could not read the factory. Check the address & network.</div>'; $("back").onclick=()=>goto(null); }
}
async function adminTx(runner, labels){
  if(!signer){ showToast({kind:"error",title:"Connect your wallet first."}); return; }
  try{
    const f=new ethers.Contract(cfg("Factory"), FACTORY_ABI, signer);
    await runTx(()=>runner(f), labels);
    aMsg("ok","Updated — refreshing…");
    renderAdmin();
  }catch(e){ aMsg("bad", parseErr(e)); }
}
function wireAdmin(){
  const ud=window.__adminUsdtDec||18;
  $("a_feeBtn").onclick=()=>{ const v=$("a_fee").value.trim(); if(!(parseFloat(v)>=0)){aMsg("bad","Enter a valid fee.");return;} adminTx(f=>f.setCreationFee(ethers.parseUnits(v,ud)),{confirm:"Update creation fee…",submitted:"Submitted",success:"Creation fee updated"}); };
  $("a_walletBtn").onclick=()=>{ const a=$("a_wallet").value.trim(); if(!ethers.isAddress(a)){aMsg("bad","Invalid address.");return;} adminTx(f=>f.setFeeWallet(a),{confirm:"Update fee wallet…",submitted:"Submitted",success:"Fee wallet updated"}); };
  $("a_feeKaviBtn").onclick=()=>{ const p=parseFloat($("a_feeKavi").value); if(!(p>=0&&p<=100)){aMsg("bad","0–100%.");return;} adminTx(f=>f.setFeeKaviBps(BigInt(Math.round(p*100))),{confirm:"Update KAVI split…",submitted:"Submitted",success:"Creation-fee KAVI split updated"}); };
  $("a_buyKaviBtn").onclick=()=>{ const p=parseFloat($("a_buyKavi").value); if(!(p>=0&&p<=100)){aMsg("bad","0–100%.");return;} adminTx(f=>f.setBuyKaviBps(BigInt(Math.round(p*100))),{confirm:"Update per-buy KAVI fee…",submitted:"Submitted",success:"Per-buy KAVI fee updated"}); };
  $("a_maxCreatorBtn").onclick=()=>{ const p=parseFloat($("a_maxCreator").value); if(!(p>=0&&p<=100)){aMsg("bad","0–100%.");return;} adminTx(f=>f.setMaxCreatorBps(BigInt(Math.round(p*100))),{confirm:"Update max creator fee…",submitted:"Submitted",success:"Max creator fee updated"}); };
  $("a_ownerBtn").onclick=()=>{ const a=$("a_owner").value.trim(); if(!ethers.isAddress(a)){aMsg("bad","Invalid address.");return;} if(!confirm("Transfer factory ownership to "+a+"? This is irreversible.")) return; adminTx(f=>f.transferOwnership(a),{confirm:"Transfer ownership…",submitted:"Submitted",success:"Ownership transferred"}); };
}
function aMsg(kind,text){ const b=$("aStatus"); if(!b) return; b.style.display="flex"; b.querySelector(".dot").className="dot "+(kind==="bad"?"bad":kind==="ok"?"ok":"pending"); $("aMsg").textContent=text; }

// ---------- detail ----------
async function renderDetail(addr){
  const box=$("view"), rp=getRead();
  box.innerHTML='<span class="back" id="back">← All sales</span><div class="empty">Loading sale…</div>';
  $("back").onclick=()=>goto(null);
  try{
    const ico=new ethers.Contract(addr, ICO_ABI, rp);
    const d=await readSale(ico, rp);
    const meta=await loadMeta(addr);
    const isCreator = account && account.toLowerCase()===d.creator.toLowerCase();
    const st=statusOf(d);
    const decN=d.dec, fmt=(x,mx=4)=>Number(ethers.formatUnits(x,decN)).toLocaleString(undefined,{maximumFractionDigits:mx});
    const fmtU=(x,mx=2)=>Number(ethers.formatUnits(x,d.usdtDec)).toLocaleString(undefined,{maximumFractionDigits:mx});
    const pct=d.forSale>0n?Number((d.sold*10000n)/d.forSale)/100:0;
    const priceU=Number(ethers.formatUnits(d.price,d.usdtDec));
    const listU=Number(ethers.formatUnits(d.listingPrice,d.usdtDec));

    let mine="";
    if(account){
      try{
        const u=await ico.getUserInfo(account);
        mine='<div class="kv"><span class="k">You purchased</span><span class="v">'+fmt(u.purchased)+' '+esc(d.sym)+'</span></div>'
          + '<div class="kv"><span class="k">You claimed</span><span class="v">'+fmt(u.claimed)+' '+esc(d.sym)+'</span></div>'
          + '<div class="kv"><span class="k">Claimable now</span><span class="v">'+fmt(u.claimable)+' '+esc(d.sym)+'</span></div>';
      }catch(e){ console.error("wallet-specific sale data failed:", e); }
    }

    let action="";
    if(st.key==="live"){
      action='<div class="panel"><div class="title-row"><h2>Buy tokens</h2></div>'
        + '<div class="field"><label for="amt">Amount to spend (USDT)</label>'
        + '<div class="row" style="gap:8px"><input id="amt" type="number" min="0" step="0.01" placeholder="0.0" style="flex:1"/><button class="btn sm" id="maxBtn" type="button" style="flex:none">Max</button></div>'
        + '<div class="hint" id="usdtBal">'+(account?"Your USDT balance: …":"Connect wallet to see your USDT balance")+'</div></div>'
        + '<div class="field"><label for="slip">Max slippage on the KAVI fee (%)</label><input id="slip" type="number" value="0.5" min="0" max="50" step="0.1"/></div>'
        + '<div class="hint" id="preview">You receive: —</div>'
        + '<button class="btn gold wide" id="buyBtn" style="margin-top:12px">Approve &amp; buy</button>'
        + '<div class="status" id="actStatus" style="display:none"><span class="dot"></span><span id="actMsg"></span></div></div>';
    } else if(st.key==="ended"){
      action='<div class="panel"><div class="title-row"><h2>List on PancakeSwap</h2></div>'
        + '<p class="hint">The sale has ended. Anyone can finalize it: liquidity is added at '+listU+' USDT and the LP is burned, then claiming opens.</p>'
        + '<button class="btn gold wide" id="listBtn" style="margin-top:12px">List on DEX</button>'
        + '<div class="status" id="actStatus" style="display:none"><span class="dot"></span><span id="actMsg"></span></div></div>';
    } else if(st.key==="listed"){
      action='<div class="panel"><div class="title-row"><h2>Claim tokens</h2></div>'
        + '<p class="hint">Released per the vesting schedule. Claim whatever has vested.</p>'
        + '<button class="btn gold wide" id="claimBtn" style="margin-top:12px">Claim vested tokens</button>'
        + '<div class="status" id="actStatus" style="display:none"><span class="dot"></span><span id="actMsg"></span></div></div>';
    } else {
      action='<div class="panel"><p class="hint">This sale starts '+new Date(Number(d.startTime)*1000).toLocaleString()+'.</p></div>';
    }

    const tge=Number(d.tgeBps)/100;
    box.innerHTML='<span class="back" id="back">← All sales</span>'
      + '<div class="panel"><div class="title-row"><h2>'+esc(d.name)+' <span style="color:var(--muted);font-size:14px">'+esc(d.sym)+'</span></h2>'
      + '<span class="badge '+st.key+'">'+st.label+'</span></div>'
      + '<div class="bar" style="margin:12px 0"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
      + '<div class="kv"><span class="k">Progress</span><span class="v">'+fmt(d.sold,0)+' / '+fmt(d.forSale,0)+' ('+pct.toFixed(1)+'%)</span></div>'
      + '<div class="kv"><span class="k">Presale price</span><span class="v">'+priceU+' USDT</span></div>'
      + '<div class="kv"><span class="k">Listing price</span><span class="v">'+listU+' USDT</span></div>'
      + '<div class="kv"><span class="k">Sale ends</span><span class="v">'+new Date(Number(d.endTime)*1000).toLocaleString()+'</span></div>'
      + '<div class="kv"><span class="k">Release</span><span class="v">'+tge+'% at listing, then '+Math.round(Number(d.vesting)/86400)+'d vest</span></div>'
      + '<div class="kv"><span class="k">Contract</span><span class="v"><a href="'+cfg("Explorer")+'/address/'+addr+'" target="_blank" rel="noopener">'+short(addr)+'</a></span></div>'
      + mine + '</div>' + renderMetaPanel(meta) + action + (isCreator ? renderEditPanel(meta) : "");

    $("back").onclick=()=>goto(null);
    if(st.key==="live") wireBuy(addr, d);
    if(st.key==="ended") $("listBtn").onclick=()=>doList(addr);
    if(st.key==="listed") $("claimBtn").onclick=()=>doClaim(addr);
    if($("saveMetaBtn")) $("saveMetaBtn").onclick=()=>saveMeta(addr, meta);
  }catch(e){ console.error("renderDetail failed:", e); box.innerHTML='<span class="back" id="back">← All sales</span><div class="empty">Could not load this sale.<br><span style="font-size:11px;color:var(--faint)">'+esc(parseErr(e))+'</span></div>'; $("back").onclick=()=>goto(null); }
}

async function readSale(ico, rp){
  const info = await ico.getSaleInfo();
  const tok=new ethers.Contract(info.saleToken, ERC20_ABI, rp);
  const pay=new ethers.Contract(info.paymentToken, ERC20_ABI, rp);
  const [name, sym, usdtDec]=await Promise.all([tok.name(), tok.symbol(), pay.decimals()]);
  return {
    saleTok:info.saleToken, payTok:info.paymentToken, creator:info.creator,
    price:info.price, listingPrice:info.listingPrice, forSale:info.tokensForSale,
    sold:info.totalSold, raised:info.totalRaised, startTime:info.startTime, endTime:info.endTime,
    tgeBps:info.tgeBps, vesting:info.vesting, listed:info.listed, releaseStart:info.releaseStart,
    buyCreatorBps:info.buyCreatorBps, buyKaviBps:info.buyKaviBps,
    name, sym, dec:Number(info.saleDecimals), usdtDec:Number(usdtDec)
  };
}

function wireBuy(addr, d){
  const upd=()=>{
    const amt=parseFloat($("amt").value||"0");
    if(!(amt>0)){ $("preview").textContent="You receive: —"; return; }
    const tokens=amt/Number(ethers.formatUnits(d.price,d.usdtDec));
    const cFee=Number(d.buyCreatorBps)/100, kFee=Number(d.buyKaviBps)/100;
    $("preview").textContent="You receive: "+tokens.toLocaleString(undefined,{maximumFractionDigits:4})+" "+d.sym+"  ·  "+cFee+"% creator fee + "+kFee+"% KAVI reserve";
  };
  $("amt").addEventListener("input",upd);
  $("buyBtn").onclick=()=>doBuy(addr, d);

  let userBal=null;
  if(account){
    (async()=>{
      try{
        const pay=new ethers.Contract(d.payTok, ERC20_ABI, getRead());
        const bal=await pay.balanceOf(account);
        userBal=bal;
        const el=$("usdtBal");
        if(el) el.textContent="Your USDT balance: "+Number(ethers.formatUnits(bal,d.usdtDec)).toLocaleString(undefined,{maximumFractionDigits:4})+" USDT";
      }catch(e){
        console.error("USDT balance fetch failed:", e);
        const el=$("usdtBal");
        if(el) el.textContent="Could not load your USDT balance.";
      }
    })();
  }
  $("maxBtn").onclick=()=>{
    if(!account){ showToast({kind:"error",title:"Connect your wallet first."}); return; }
    if(userBal===null){ showToast({kind:"info",title:"Still loading your balance…"}); return; }
    $("amt").value=ethers.formatUnits(userBal,d.usdtDec);
    upd();
  };
}

async function doBuy(addr, d){
  if(!signer){ showToast({kind:"error",title:"Connect your wallet first."}); $("connectBtn").click&&$("connectBtn").click(); return; }
  const amtStr=$("amt").value.trim();
  if(!(parseFloat(amtStr)>0)){ actMsg("bad","Enter an amount."); return; }
  try{
    const pay=ethers.parseUnits(amtStr, d.usdtDec);
    const usdt=new ethers.Contract(d.payTok, ERC20_ABI, signer);
    const allow=await usdt.allowance(account, addr);
    if(allow < pay){
      await runTx(()=>usdt.approve(addr, pay), {confirm:"Approve USDT — confirm in wallet…", submitted:"Approval submitted", success:"USDT approved"});
    }
    // slippage-guarded minKaviOut for the 5% KAVI fee
    const icoR=new ethers.Contract(addr, ICO_ABI, getRead());
    let minKaviOut=0n;
    try{
      const [, expKavi]=await icoR.quoteKaviOut(pay);
      const slip=parseFloat($("slip").value||"0.5");
      const bps=BigInt(Math.round(Math.max(0,Math.min(50,slip))*100));
      minKaviOut=(expKavi*(10000n-bps))/10000n;
    }catch(e){ /* if quote fails, proceed with 0 (KAVI/USDT liquidity may be missing) */ }
    const ico=new ethers.Contract(addr, ICO_ABI, signer);
    await runTx(()=>ico.buy(pay, minKaviOut), {confirm:"Buy — confirm in wallet…", submitted:"Purchase submitted", success:"Tokens purchased"});
    actMsg("ok","Purchased. Tokens unlock after listing.");
    renderDetail(addr);
  }catch(e){ actMsg("bad", parseErr(e)); }
}
async function doList(addr){
  if(!signer){ showToast({kind:"error",title:"Connect your wallet first."}); return; }
  try{
    const ico=new ethers.Contract(addr, ICO_ABI, signer);
    await runTx(()=>ico.listOnDex(), {confirm:"List on DEX — confirm in wallet…", submitted:"Listing submitted", success:"Listed on PancakeSwap"});
    renderDetail(addr);
  }catch(e){ actMsg("bad", parseErr(e)); }
}
async function doClaim(addr){
  if(!signer){ showToast({kind:"error",title:"Connect your wallet first."}); return; }
  try{
    const ico=new ethers.Contract(addr, ICO_ABI, signer);
    await runTx(()=>ico.claim(), {confirm:"Claim — confirm in wallet…", submitted:"Claim submitted", success:"Tokens claimed"});
    renderDetail(addr);
  }catch(e){ actMsg("bad", parseErr(e)); }
}
function actMsg(kind, text){ const b=$("actStatus"); if(!b) return; b.style.display="flex"; b.querySelector(".dot").className="dot "+(kind==="ok"?"ok":kind==="bad"?"bad":"pending"); $("actMsg").textContent=text; }

const hdrA=$("hdrAdminBtn"); if(hdrA) hdrA.onclick=()=>gotoAdmin();
render();
</script>
